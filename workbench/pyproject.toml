[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawb"
version = "0.1.0"
description = "Offline local agent workbench: public skills, error loops, multi-agent queue, PDF parsing, diagrams, literature counts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24", "pypdf>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lawb = ["recommendations.json", "bundled/**/*", "bundled/*"]
